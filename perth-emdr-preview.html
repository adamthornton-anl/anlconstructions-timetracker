<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perth EMDR Logo Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 { color: #2D6B7A; margin-bottom: 30px; font-size: 24px; }
        svg { max-width: 100%; height: auto; }
        .info { margin-top: 30px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Perth EMDR Therapy Centre Logo</h1>
        
        <svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" style="width: 400px; height: 520px;">
            <!-- Rolling hills/landscape (right side) -->
            <path d="M 240 160 Q 260 140 280 160 Q 300 140 320 160 L 320 240 Q 300 220 280 240 Q 260 220 240 240 Z" fill="#7BA888"/>
            <path d="M 220 180 Q 240 160 260 180 Q 280 160 300 180 L 300 240 Q 280 220 260 240 Q 240 220 220 240 Z" fill="#8BB896"/>
            
            <!-- Stepping stones path (center) -->
            <ellipse cx="200" cy="210" rx="14" ry="11" fill="#9D8B75" opacity="0.85"/>
            <ellipse cx="200" cy="245" rx="16" ry="13" fill="#9D8B75" opacity="0.85"/>
            <ellipse cx="200" cy="280" rx="14" ry="11" fill="#9D8B75" opacity="0.85"/>
            
            <!-- Sun/light at top -->
            <circle cx="200" cy="100" r="24" fill="#E8D0B8" opacity="0.9"/>
            
            <!-- Foliage/leaves on left -->
            <g>
                <!-- Branch -->
                <path d="M 130 140 Q 115 170 120 200" stroke="#5A8B6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <!-- Leaf 1 -->
                <ellipse cx="118" cy="130" rx="9" ry="6" fill="#6A9B7A" transform="rotate(-40 118 130)"/>
                <!-- Leaf 2 -->
                <ellipse cx="112" cy="155" rx="9" ry="6" fill="#6A9B7A" transform="rotate(-20 112 155)"/>
                <!-- Leaf 3 -->
                <ellipse cx="115" cy="180" rx="9" ry="6" fill="#6A9B7A" transform="rotate(10 115 180)"/>
                <!-- Leaf 4 -->
                <ellipse cx="125" cy="205" rx="9" ry="6" fill="#7AAB8A" transform="rotate(30 125 205)"/>
            </g>
            
            <!-- Circle border -->
            <circle cx="200" cy="170" r="135" fill="none" stroke="#2D6B7A" stroke-width="3"/>
            
            <!-- Company name section -->
            <text x="200" y="370" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#2D6B7A">Perth EMDR</text>
            
            <text x="200" y="405" font-family="Georgia, serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#2D6B7A" letter-spacing="2">THERAPY CENTRE</text>
            
            <text x="200" y="435" font-family="Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#5A7F7F">supporting you one step at a time</text>
        </svg>
        
        <div class="info">
            <p><strong>Logo Details:</strong></p>
            <p>✓ Circular frame with teal border<br/>
            ✓ Rolling hills landscape (right)<br/>
            ✓ Stepping stones path (center)<br/>
            ✓ Sun/light circle (top)<br/>
            ✓ Leaf foliage (left)<br/>
            ✓ Transparent background<br/>
            ✓ Professional serif typography</p>
        </div>
    </div>
</body>
</html>
