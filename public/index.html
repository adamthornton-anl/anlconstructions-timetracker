<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnlConstructions Time Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; }
    .header { background: #333; color: white; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 20px auto; padding: 0 20px; }
    .page { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; margin-bottom: 10px; }
    h2 { font-size: 20px; margin-bottom: 20px; }
    .hidden { display: none; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; }
    .btn-primary { background: #0066cc; }
    .btn-primary:hover { background: #0052a3; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #c82333; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }
    label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    .error { color: red; padding: 10px; background: #ffe0e0; border-radius: 4px; margin-bottom: 12px; }
    .success-msg { color: green; padding: 10px; background: #e0ffe0; border-radius: 4px; margin-bottom: 12px; }
    .clock { font-size: 48px; text-align: center; color: #333; margin: 20px 0; font-family: monospace; font-weight: bold; }
    .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
    .day { background: #f0f0f0; padding: 15px; text-align: center; border-radius: 4px; }
    .day-name { font-weight: bold; font-size: 12px; }
    .day-hours { font-size: 18px; font-weight: bold; color: #0066cc; margin-top: 8px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
    .stat-box { background: #f0f0f0; padding: 15px; text-align: center; border-radius: 4px; }
    .stat-label { font-size: 12px; color: #666; }
    .stat-value { font-size: 24px; font-weight: bold; color: #0066cc; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⏰ TIME TRACKER</h1>
    <p>AnlConstructions</p>
  </div>

  <div class="container">
    <!-- LOGIN PAGE -->
    <div id="page-login" class="page">
      <h2>Login</h2>
      <div id="error-login" class="hidden error"></div>
      
      <label>Worker</label>
      <select id="select-worker">
        <option value="">-- Select --</option>
        <option value="Adam">Adam ($81.49/hr)</option>
        <option value="James">James ($48.65/hr)</option>
        <option value="Brady">Brady ($29.95/hr)</option>
        <option value="Drew">Drew ($81.49/hr)</option>
      </select>
      
      <label>PIN</label>
      <input type="password" id="input-pin" maxlength="4" placeholder="0000" inputmode="numeric">
      
      <button class="btn-primary" onclick="app_login()">Login</button>
    </div>

    <!-- TRACKER PAGE -->
    <div id="page-tracker" class="hidden page">
      <h2 id="title-worker"></h2>
      <div id="msg-success" class="hidden success-msg"></div>
      
      <div class="clock" id="display-clock">00:00:00</div>
      
      <button class="btn-success" onclick="app_checkin()">✓ CHECK IN</button>
      <button class="btn-danger" onclick="app_checkout()">✗ CHECK OUT</button>
      
      <label>Lunch Break (minutes)</label>
      <select id="select-lunch">
        <option value="0">None</option>
        <option value="30">30</option>
        <option value="45">45</option>
        <option value="60">60</option>
      </select>
      
      <h3 style="margin-top: 20px; margin-bottom: 12px;">Weekly Hours</h3>
      <div class="week-grid" id="grid-week"></div>
      
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Total Hours</div>
          <div class="stat-value" id="value-hours">0.0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Weekly Pay</div>
          <div class="stat-value" id="value-pay">$0.00</div>
        </div>
      </div>
      
      <label>Job Location</label>
      <input type="text" id="input-job" placeholder="e.g. 123 Main St">
      
      <label>Materials</label>
      <textarea id="input-materials" placeholder="Concrete, nails..." style="height: 80px;"></textarea>
      
      <button class="btn-primary" onclick="app_save()">SAVE ENTRY</button>
      <button class="btn-secondary" onclick="app_logout()">Logout</button>
    </div>
  </div>

  <script>
    const WORKERS = {
      'Adam': { id: 'ba97c403-596f-483b-8dd5-3c11131db62a', pin: '7264', rate: 81.49 },
      'James': { id: '7b309a07-cfea-4e78-8109-e7b7d40f4cf4', pin: '5891', rate: 48.65 },
      'Brady': { id: 'be3737d8-0235-4fb8-85a6-6150659a278f', pin: '3742', rate: 29.95 },
      'Drew': { id: '3397c62c-b85e-4cda-ac24-fd138b1eb74a', pin: '8159', rate: 81.49 }
    };

    let user = null;
    let entries = {};

    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('display-clock').textContent = h + ':' + m + ':' + s;
    }

    setInterval(tick, 1000);
    tick();

    function app_login() {
      const name = document.getElementById('select-worker').value;
      const pin = document.getElementById('input-pin').value;
      const err = document.getElementById('error-login');
      
      err.classList.add('hidden');
      
      if (!name) {
        err.textContent = 'Select a worker';
        err.classList.remove('hidden');
        return;
      }
      
      if (pin.length !== 4) {
        err.textContent = 'PIN must be 4 digits';
        err.classList.remove('hidden');
        return;
      }
      
      const w = WORKERS[name];
      if (pin !== w.pin) {
        err.textContent = 'Invalid PIN';
        err.classList.remove('hidden');
        return;
      }
      
      user = { name: name, ...w };
      document.getElementById('page-login').classList.add('hidden');
      document.getElementById('page-tracker').classList.remove('hidden');
      document.getElementById('title-worker').textContent = user.name;
      fetch_entries();
    }

    function app_logout() {
      user = null;
      entries = {};
      document.getElementById('page-tracker').classList.add('hidden');
      document.getElementById('page-login').classList.remove('hidden');
      document.getElementById('select-worker').value = '';
      document.getElementById('input-pin').value = '';
    }

    function app_checkin() {
      const day = getday();
      const time = new Date().toISOString();
      
      fetch('/api/entry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: user.id,
          day: day,
          start_time: time
        })
      }).then(r => r.json()).then(d => {
        show_msg('Checked in at ' + time);
        fetch_entries();
      });
    }

    function app_checkout() {
      const day = getday();
      const time = new Date().toISOString();
      
      fetch('/api/entry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: user.id,
          day: day,
          end_time: time
        })
      }).then(r => r.json()).then(d => {
        show_msg('Checked out at ' + time);
        fetch_entries();
      });
    }

    function app_save() {
      const day = getday();
      const lunch = parseInt(document.getElementById('select-lunch').value);
      const job = document.getElementById('input-job').value;
      const materials = document.getElementById('input-materials').value;
      
      fetch('/api/entry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: user.id,
          day: day,
          lunch_mins: lunch,
          job: job,
          materials: materials
        })
      }).then(r => r.json()).then(d => {
        show_msg('Entry saved');
        fetch_entries();
      });
    }

    function fetch_entries() {
      fetch('/api/entries/' + user.id)
        .then(r => r.json())
        .then(data => {
          entries = {};
          if (Array.isArray(data)) {
            data.forEach(e => {
              entries[e.day] = e;
            });
          }
          render_week();
        });
    }

    function render_week() {
      const grid = document.getElementById('grid-week');
      grid.innerHTML = '';
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      let total = 0;

      days.forEach(day => {
        const e = entries[day];
        let h = 0;
        
        if (e && e.start_time && e.end_time) {
          const ms = (new Date(e.end_time) - new Date(e.start_time));
          const mins = ms / 60000 - (e.lunch_mins || 0);
          h = Math.max(0, mins / 60);
          total += h;
        }

        const cell = document.createElement('div');
        cell.className = 'day';
        cell.innerHTML = '<div class="day-name">' + day + '</div><div class="day-hours">' + h.toFixed(1) + 'h</div>';
        grid.appendChild(cell);
      });

      document.getElementById('value-hours').textContent = total.toFixed(1);
      document.getElementById('value-pay').textContent = '$' + (total * user.rate).toFixed(2);
    }

    function show_msg(msg) {
      const el = document.getElementById('msg-success');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2000);
    }

    function getday() {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return days[new Date().getDay()];
    }
  </script>
</body>
</html>
