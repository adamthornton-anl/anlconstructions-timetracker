<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker - AnlConstructions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
    .container { max-width: 500px; margin: 20px auto; padding: 0 20px; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5568d3; }
    .btn-primary:active { background: #4451b8; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }
    .hidden { display: none !important; }
    .error { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .success { background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .worker-list { display: grid; gap: 8px; margin-bottom: 16px; }
    .worker-btn { padding: 12px; background: #f0f0f0; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; text-align: left; transition: 0.2s; }
    .worker-btn:hover { border-color: #667eea; background: #f8faff; }
    .worker-btn.selected { background: #667eea; color: white; border-color: #667eea; }
    .clock { font-size: 48px; font-weight: 700; text-align: center; color: #667eea; margin: 20px 0; font-family: monospace; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .button-row button { margin-bottom: 0; }
    .week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
    .day-cell { background: #f0f0f0; padding: 12px 8px; border-radius: 8px; text-align: center; }
    .day-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; }
    .day-hours { font-size: 18px; font-weight: 700; color: #667eea; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .stat { background: #f0f0f0; padding: 16px; border-radius: 8px; text-align: center; }
    .stat-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 8px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⏰ TIME TRACKER</h1>
    <p>AnlConstructions - Perth, WA</p>
  </div>

  <div class="container">
    <!-- LOGIN PAGE -->
    <div id="page-login">
      <div class="card">
        <h2>Login</h2>
        <div id="login-error" class="hidden error"></div>
        
        <label>Select Your Name</label>
        <div class="worker-list" id="worker-list"></div>
        
        <label>Enter PIN</label>
        <input type="password" id="pin-input" maxlength="4" placeholder="0000" inputmode="numeric">
        
        <button class="btn-primary" onclick="App.login()">LOGIN</button>
      </div>
    </div>

    <!-- TRACKER PAGE -->
    <div id="page-tracker" class="hidden">
      <div class="card">
        <h2 id="worker-title"></h2>
        <div id="tracker-message" class="hidden success"></div>
        
        <div class="clock" id="clock-display">00:00:00</div>
        
        <div class="button-row">
          <button class="btn-success" onclick="App.checkIn()">✓ CHECK IN</button>
          <button class="btn-danger" onclick="App.checkOut()">✗ CHECK OUT</button>
        </div>

        <label>Lunch Break</label>
        <select id="lunch-select">
          <option value="0">No break</option>
          <option value="30">30 minutes</option>
          <option value="45">45 minutes</option>
          <option value="60">1 hour</option>
        </select>

        <h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 16px;">Weekly Hours</h3>
        <div class="week-grid" id="week-grid"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Total Hours</div>
            <div class="stat-value" id="total-hours">0.0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Weekly Pay</div>
            <div class="stat-value" id="weekly-pay">$0.00</div>
          </div>
        </div>

        <label>Job / Location</label>
        <input type="text" id="job-input" placeholder="e.g., 123 Main St">

        <label>Materials Needed</label>
        <textarea id="materials-input" placeholder="Concrete, nails, timber..." style="height: 80px;"></textarea>

        <button class="btn-success" onclick="App.save()" style="margin-bottom: 12px;">💾 SAVE ENTRY</button>
        <button class="btn-secondary" onclick="App.logout()">LOGOUT</button>
      </div>
    </div>
  </div>

  <script>
    const WORKERS = {
      'Adam': { id: 'ba97c403-596f-483b-8dd5-3c11131db62a', pin: '7264', rate: 81.49 },
      'James': { id: '7b309a07-cfea-4e78-8109-e7b7d40f4cf4', pin: '5891', rate: 48.65 },
      'Brady': { id: 'be3737d8-0235-4fb8-85a6-6150659a278f', pin: '3742', rate: 29.95 },
      'Drew': { id: '3397c62c-b85e-4cda-ac24-fd138b1eb74a', pin: '8159', rate: 81.49 }
    };

    const App = {
      user: null,
      selectedWorker: null,
      entries: {},

      init() {
        this.renderWorkers();
        this.updateClock();
        setInterval(() => this.updateClock(), 1000);
      },

      renderWorkers() {
        const list = document.getElementById('worker-list');
        Object.keys(WORKERS).forEach(name => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'worker-btn';
          btn.textContent = name + ' • $' + WORKERS[name].rate.toFixed(2) + '/hr';
          btn.onclick = () => this.selectWorker(name, btn);
          list.appendChild(btn);
        });
      },

      selectWorker(name, btn) {
        this.selectedWorker = name;
        document.querySelectorAll('.worker-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      },

      login() {
        const pin = document.getElementById('pin-input').value;
        const err = document.getElementById('login-error');
        err.classList.add('hidden');

        if (!this.selectedWorker) {
          err.textContent = 'Please select a worker';
          err.classList.remove('hidden');
          return;
        }

        if (pin.length !== 4) {
          err.textContent = 'PIN must be 4 digits';
          err.classList.remove('hidden');
          return;
        }

        const worker = WORKERS[this.selectedWorker];
        if (pin !== worker.pin) {
          err.textContent = 'Invalid PIN';
          err.classList.remove('hidden');
          return;
        }

        // Success
        this.user = { name: this.selectedWorker, ...worker };
        document.getElementById('page-login').classList.add('hidden');
        document.getElementById('page-tracker').classList.remove('hidden');
        document.getElementById('worker-title').textContent = this.user.name + "'s Time Tracker";
        this.loadEntries();
      },

      logout() {
        this.user = null;
        this.selectedWorker = null;
        document.getElementById('page-tracker').classList.add('hidden');
        document.getElementById('page-login').classList.remove('hidden');
        document.getElementById('pin-input').value = '';
        document.getElementById('worker-list').querySelectorAll('button').forEach(b => b.classList.remove('selected'));
      },

      updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock-display').textContent = h + ':' + m + ':' + s;
      },

      async checkIn() {
        const day = this.getDay();
        const time = new Date().toISOString();
        
        const res = await fetch('/api/entry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: this.user.id,
            day: day,
            start_time: time
          })
        });

        if (res.ok) {
          this.showMessage('✓ Checked in');
          this.loadEntries();
        }
      },

      async checkOut() {
        const day = this.getDay();
        const time = new Date().toISOString();

        const res = await fetch('/api/entry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: this.user.id,
            day: day,
            end_time: time
          })
        });

        if (res.ok) {
          this.showMessage('✓ Checked out');
          this.loadEntries();
        }
      },

      async save() {
        const day = this.getDay();
        const lunch = parseInt(document.getElementById('lunch-select').value);
        const job = document.getElementById('job-input').value;
        const materials = document.getElementById('materials-input').value;

        const res = await fetch('/api/entry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: this.user.id,
            day: day,
            lunch_mins: lunch,
            job: job,
            materials: materials
          })
        });

        if (res.ok) {
          this.showMessage('✅ Entry saved');
          this.loadEntries();
        }
      },

      async loadEntries() {
        const res = await fetch('/api/entries/' + this.user.id);
        if (res.ok) {
          const data = await res.json();
          this.entries = {};
          if (Array.isArray(data)) {
            data.forEach(entry => {
              this.entries[entry.day] = entry;
            });
          }
        }
        this.renderWeek();
      },

      renderWeek() {
        const grid = document.getElementById('week-grid');
        grid.innerHTML = '';
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        let total = 0;

        days.forEach(day => {
          const entry = this.entries[day];
          let hours = 0;

          if (entry && entry.start_time && entry.end_time) {
            const start = new Date(entry.start_time);
            const end = new Date(entry.end_time);
            const mins = (end - start) / 60000 - (entry.lunch_mins || 0);
            hours = Math.max(0, mins / 60);
            total += hours;
          }

          const cell = document.createElement('div');
          cell.className = 'day-cell';
          cell.innerHTML = '<div class="day-label">' + day + '</div><div class="day-hours">' + hours.toFixed(1) + 'h</div>';
          grid.appendChild(cell);
        });

        document.getElementById('total-hours').textContent = total.toFixed(1);
        document.getElementById('weekly-pay').textContent = '$' + (total * this.user.rate).toFixed(2);
      },

      showMessage(msg) {
        const el = document.getElementById('tracker-message');
        el.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2000);
      },

      getDay() {
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        return days[new Date().getDay()];
      }
    };

    App.init();
  </script>
</body>
</html>
