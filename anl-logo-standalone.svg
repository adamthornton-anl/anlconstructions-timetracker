<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- ANL CONSTRUCTIONS LOGO - Standalone -->
  
  <!-- Main circle background (optional light background) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#D4845C" stroke-width="2"/>
  
  <!-- "A" - Building/Structure -->
  <g id="letter-a">
    <!-- Left side of A -->
    <line x1="50" y1="140" x2="70" y2="50" stroke="#D4845C" stroke-width="3" stroke-linecap="round"/>
    <!-- Right side of A -->
    <line x1="90" y1="140" x2="70" y2="50" stroke="#D4845C" stroke-width="3" stroke-linecap="round"/>
    <!-- Crossbar -->
    <line x1="58" y1="100" x2="82" y2="100" stroke="#D4845C" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- "N" - Levels/Floors -->
  <g id="letter-n">
    <!-- Left vertical -->
    <line x1="110" y1="140" x2="110" y2="50" stroke="#C89968" stroke-width="3" stroke-linecap="round"/>
    <!-- Diagonal -->
    <line x1="110" y1="140" x2="140" y2="50" stroke="#C89968" stroke-width="3" stroke-linecap="round"/>
    <!-- Right vertical -->
    <line x1="140" y1="50" x2="140" y2="140" stroke="#C89968" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- "L" - Foundation -->
  <g id="letter-l">
    <!-- Vertical line -->
    <line x1="150" y1="50" x2="150" y2="140" stroke="#D4A574" stroke-width="3" stroke-linecap="round"/>
    <!-- Horizontal base -->
    <line x1="150" y1="140" x2="175" y2="140" stroke="#D4A574" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative element - Construction symbol (building frame) -->
  <g id="construction-symbol" opacity="0.8">
    <!-- Small construction grid at bottom -->
    <rect x="60" y="155" width="80" height="25" fill="none" stroke="#D4845C" stroke-width="1.5" rx="2"/>
    <!-- Grid pattern -->
    <line x1="70" y1="155" x2="70" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="80" y1="155" x2="80" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="90" y1="155" x2="90" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="100" y1="155" x2="100" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="110" y1="155" x2="110" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="120" y1="155" x2="120" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="130" y1="155" x2="130" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
    <line x1="140" y1="155" x2="140" y2="180" stroke="#D4845C" stroke-width="1" opacity="0.6"/>
  </g>
</svg>