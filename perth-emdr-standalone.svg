<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <!-- CIRCULAR LOGO MARK -->
  <g id="logo-mark" transform="translate(100, 50)">
    <!-- Outer circle border -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="#3B7A8A" stroke-width="3"/>
    
    <!-- Rolling hills/landscape (right side) -->
    <path d="M 160 110 Q 180 90 200 110 L 200 180 Q 180 160 160 180 Z" fill="#7BA888"/>
    <path d="M 140 130 Q 160 110 180 130 L 180 180 Q 160 160 140 180 Z" fill="#8BB896"/>
    
    <!-- Stepping stones (center path) -->
    <ellipse cx="100" cy="130" rx="12" ry="10" fill="#9D8B75"/>
    <ellipse cx="100" cy="160" rx="14" ry="11" fill="#9D8B75"/>
    <ellipse cx="100" cy="190" rx="12" ry="10" fill="#9D8B75"/>
    
    <!-- Sun circle (top) -->
    <circle cx="100" cy="50" r="20" fill="#E8D0B8"/>
    
    <!-- Foliage/leaf branch (left side) -->
    <g id="leaves">
      <path d="M 70 80 Q 55 110 65 145" stroke="#5A8B6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="55" cy="70" rx="8" ry="5" fill="#6A9B7A" transform="rotate(-35 55 70)"/>
      <ellipse cx="60" cy="95" rx="8" ry="5" fill="#6A9B7A" transform="rotate(-15 60 95)"/>
      <ellipse cx="65" cy="120" rx="8" ry="5" fill="#6A9B7A" transform="rotate(10 65 120)"/>
      <ellipse cx="70" cy="145" rx="8" ry="5" fill="#7AAB8A" transform="rotate(30 70 145)"/>
    </g>
  </g>
  
  <!-- TEXT SECTION -->
  <text x="250" y="300" font-family="Georgia, serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#3B7A8A">Perth EMDR</text>
  
  <text x="250" y="335" font-family="Georgia, serif" font-size="20" text-anchor="middle" fill="#3B7A8A" letter-spacing="3">THERAPY CENTRE</text>
  
  <text x="250" y="365" font-family="Georgia, serif" font-size="14" font-style="italic" text-anchor="middle" fill="#5A7F7F">supporting you one step at a time</text>
</svg>