<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anlconstructions Time Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a1a; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; text-align: center; }
    .header h1 { font-size: 28px; margin-bottom: 4px; }
    .container { max-width: 500px; margin: 20px auto; padding: 0 16px 40px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #5568d3; }
    button.success { background: #22c55e; }
    button.danger { background: #ef4444; }
    button.secondary { background: #64748b; }
    .hidden { display: none; }
    .error { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .success-msg { color: #16a34a; background: #dcfce7; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .time-big { font-size: 32px; font-weight: 700; text-align: center; color: #667eea; margin: 24px 0; font-family: monospace; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
    .cell { background: #f0f4f8; padding: 12px; border-radius: 8px; text-align: center; }
    .cell-day { font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
    .cell-hours { font-size: 16px; font-weight: 700; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .stat { background: #f0f4f8; padding: 16px; border-radius: 8px; text-align: center; }
    .stat-label { font-size: 12px; font-weight: 600; color: #64748b; }
    .stat-value { font-size: 24px; font-weight: 700; color: #667eea; margin-top: 8px; }
    .worker-select { display: grid; gap: 8px; margin-bottom: 16px; }
    .worker-btn { padding: 12px; background: #f0f4f8; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 500; }
    .worker-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .button-row button { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⏰ Time Tracker</h1>
    <p>Anlconstructions</p>
  </div>

  <div class="container">
    <!-- LOGIN -->
    <div id="login-screen">
      <div class="card">
        <h2 style="margin-bottom: 20px;">👤 Login</h2>
        <div id="login-error" class="hidden error"></div>
        <div class="worker-select" id="worker-list"></div>
        <div class="form-group">
          <label>PIN</label>
          <input type="password" id="pin" maxlength="4" placeholder="4-digit PIN">
        </div>
        <button onclick="login()">Login</button>
      </div>
    </div>

    <!-- TRACKER -->
    <div id="tracker-screen" class="hidden">
      <div class="card">
        <h2 id="welcome" style="margin-bottom: 20px;"></h2>
        <div id="msg" class="hidden"></div>

        <div class="time-big" id="clock"></div>

        <div class="button-row">
          <button class="success" onclick="checkIn()">✓ Check In</button>
          <button class="danger" onclick="checkOut()">✗ Check Out</button>
        </div>

        <div class="form-group">
          <label>Lunch Break</label>
          <select id="lunch">
            <option value="0">None</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">1 hour</option>
          </select>
        </div>

        <div class="grid" id="week"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Hours This Week</div>
            <div class="stat-value" id="total-hours">0.0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Total Pay</div>
            <div class="stat-value" id="total-pay">$0.00</div>
          </div>
        </div>

        <div class="form-group">
          <label>Job / Location</label>
          <input type="text" id="job" placeholder="e.g., Main St Renovation">
        </div>

        <div class="form-group">
          <label>Materials Needed</label>
          <textarea id="materials" placeholder="Concrete, nails, timber..." style="height: 80px;"></textarea>
        </div>

        <button class="success" onclick="save()" style="margin-bottom: 12px;">💾 Save Entry</button>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <script>
    let user = null;
    let workers = [];

    async function init() {
      const res = await fetch('/api/workers');
      workers = await res.json();
      const list = document.getElementById('worker-list');
      workers.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'worker-btn';
        btn.textContent = `${w.name} • $${w.hourly_rate}/hr`;
        btn.onclick = () => selectWorker(w);
        list.appendChild(btn);
      });
      tick();
      setInterval(tick, 1000);
    }

    function selectWorker(w) {
      document.querySelectorAll('.worker-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      user = w;
    }

    async function login() {
      const pin = document.getElementById('pin').value;
      const err = document.getElementById('login-error');
      err.classList.add('hidden');

      if (!user) {
        err.textContent = 'Select a worker';
        err.classList.remove('hidden');
        return;
      }

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: user.name, pin })
      });

      const data = await res.json();
      if (!data.ok) {
        err.textContent = 'Invalid PIN';
        err.classList.remove('hidden');
        return;
      }

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('tracker-screen').classList.remove('hidden');
      document.getElementById('welcome').textContent = user.name + "'s Time Tracker";
      load();
    }

    function logout() {
      user = null;
      document.getElementById('tracker-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('pin').value = '';
    }

    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function checkIn() {
      const today = getToday();
      const time = new Date().toISOString();
      const entry = { user_id: user.id, day: getDay(today), start_time: time };
      await fetch('/api/entry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
      load();
    }

    async function checkOut() {
      const today = getToday();
      const time = new Date().toISOString();
      const res = await fetch(`/api/entries/${user.id}`);
      const entries = await res.json();
      const entry = entries.find(e => e.day === getDay(today));
      if (entry) {
        const updated = { ...entry, end_time: time };
        await fetch('/api/entry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) });
      }
      load();
    }

    async function save() {
      const today = getToday();
      const lunch = parseInt(document.getElementById('lunch').value);
      const job = document.getElementById('job').value;
      const materials = document.getElementById('materials').value;
      
      const res = await fetch(`/api/entries/${user.id}`);
      const entries = await res.json();
      const entry = entries.find(e => e.day === getDay(today)) || {};
      
      const payload = {
        user_id: user.id,
        day: getDay(today),
        start_time: entry.start_time,
        end_time: entry.end_time,
        lunch_mins: lunch,
        job,
        materials
      };
      
      await fetch('/api/entry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const msg = document.getElementById('msg');
      msg.textContent = '✅ Saved!';
      msg.classList.remove('hidden');
      msg.classList.add('success-msg');
      setTimeout(() => msg.classList.add('hidden'), 2000);
      load();
    }

    async function load() {
      const res = await fetch(`/api/entries/${user.id}`);
      const entries = res.ok ? await res.json() : [];
      render(entries);
    }

    function render(entries) {
      const grid = document.getElementById('week');
      grid.innerHTML = '';
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      let total = 0;

      days.forEach(day => {
        const entry = entries.find(e => e.day === day);
        let hours = 0;
        if (entry && entry.start_time && entry.end_time) {
          const start = new Date(entry.start_time);
          const end = new Date(entry.end_time);
          const mins = (end - start) / 60000 - (entry.lunch_mins || 0);
          hours = Math.max(0, mins / 60);
          total += hours;
        }

        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `<div class="cell-day">${day}</div><div class="cell-hours">${hours.toFixed(1)}h</div>`;
        grid.appendChild(cell);
      });

      document.getElementById('total-hours').textContent = total.toFixed(1);
      document.getElementById('total-pay').textContent = '$' + (total * user.hourly_rate).toFixed(2);
    }

    function getToday() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function getDay(date) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return days[date.getDay()];
    }

    init();
  </script>
</body>
</html>
